{% extends "base.html" %}
{% block title %}Alta alumno{% endblock %}
{% block content %}
<div class="page-header"><h1>Alta alumno</h1></div>
<form method="post" class="form-card">
  {% csrf_token %}
  <div class="form-group">
    <label class="form-label">Nombre</label>
    <input class="form-input" name="nombre_completo" required>
  </div>
  <div class="form-group">
    <label class="form-label">Tipo</label>
    <select class="form-input" name="tipo" required>
      {% for val, label in tipos %}<option value="{{ val }}">{{ label }}</option>{% endfor %}
    </select>
  </div>
  <div class="form-group">
    <label class="form-label">Notas</label>
    <input class="form-input" name="notas">
  </div>
  <div class="form-actions">
    <button type="submit" class="btn-primary">Crear</button>
  </div>
</form>
<p class="link-back"><a href="{% url 'alumnos_list' %}">Volver</a></p>
{% endblock %}
