{% extends "base.html" %}
{% load static %}
{% block body_class %}auth-page{% endblock %}
{% block title %}Login — Spirit{% endblock %}
{% block content %}
<div class="auth-wrap">
  <img class="auth-logo" src="{% static 'img/logo-spirit-blanco.png' %}" alt="Spirit Academia">
  <div class="auth-card">
    {% if error %}<p class="err">{{ error }}</p>{% endif %}
    <form method="post" class="form-card auth-form">
      {% csrf_token %}
      <div class="form-group">
        <label class="form-label">Usuario</label>
        <input class="form-input" name="username" required autofocus>
      </div>
      <div class="form-group">
        <label class="form-label">Contraseña</label>
        <input class="form-input" type="password" name="password" required>
      </div>
      <div class="form-actions">
        <button type="submit" class="btn btn-primary btn-block">Entrar</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
