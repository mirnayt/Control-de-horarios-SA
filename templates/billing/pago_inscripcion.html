{% extends "base.html" %}
{% block title %}Pagar inscripción{% endblock %}
{% block content %}
<div class="page-header">
  <h1>Pagar inscripción</h1>
  <p><a href="{% url 'alumno_detail' alumno.id %}">{{ alumno.nombre_completo }}</a></p>
  <p><strong>Saldo: ${{ saldo }}</strong> <span class="muted">(cargo ${{ linea.monto }})</span></p>
</div>
<form method="post" class="form-card">
  {% csrf_token %}
  <div class="form-group">
    <label class="form-label">Monto a cobrar (abono)</label>
    <input class="form-input" type="number" step="0.01" min="0.01" name="monto" value="{{ saldo }}" required>
  </div>
  <div class="form-group">
    <label class="form-label">Ajustar cargo (opcional)</label>
    <input class="form-input" type="number" step="0.01" min="0.01" name="monto_override" placeholder="Nuevo monto">
    <input class="form-input" name="motivo_ajuste" placeholder="Motivo del ajuste" style="margin-top:.4rem;">
  </div>
  <div class="form-group checkbox-group">
    <label><input type="checkbox" name="requiere_factura" value="1"{% if requiere_factura %} checked{% endif %}> Requiere factura (se agrega IVA)</label>
  </div>
  <div class="form-group">
    <label class="form-label">Método</label>
    <select class="form-input" name="metodo_codigo">
      {% for codigo, nombre in metodos %}
      <option value="{{ codigo }}">{{ nombre }}</option>
      {% endfor %}
    </select>
  </div>
  <div class="form-group">
    <label class="form-label">Referencia</label>
    <input class="form-input" name="referencia" placeholder="Núm. transferencia / link">
  </div>
  <div class="form-group">
    <label class="form-label">Notas</label>
    <input class="form-input" name="notas">
  </div>
  <div class="form-actions">
    <button type="submit" class="btn-primary">Confirmar pago</button>
  </div>
</form>
<p class="link-back"><a href="{% url 'pagos_list' %}?alumno_id={{ alumno.id }}">Volver</a></p>
{% endblock %}
