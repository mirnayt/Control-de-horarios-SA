[build]
builder = "NIXPACKS"

[deploy]
startCommand = "gunicorn config.wsgi:application --bind 0.0.0.0:$PORT"
releaseCommand = "python manage.py migrate --noinput && python manage.py seed_operacion && python manage.py collectstatic --noinput"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
